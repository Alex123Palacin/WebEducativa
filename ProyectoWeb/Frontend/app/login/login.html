<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Login y Register - MagtimusPro</title>

    <link rel="stylesheet" href="loginestilo.css" />
  </head>
  <body>
    <main>
      <!-- Contenedor principal -->
      <div class="contenedor__todo">
        <!-- Caja trasera para opciones de login y registro -->
        <div class="caja__trasera">

          <!-- Sección de inicio de sesión -->
          <div class="caja__trasera-login">
            <h3>¿Ya tienes una cuenta?</h3>
            <!-- Pregunta al usuario -->
            <p>Inicia sesión para entrar en la página</p>
            <!-- Instrucciones -->
            <button id="btn__iniciar-sesion">Iniciar Sesión</button>
            <!-- Botón de inicio de sesión -->
          </div>

          <!-- Sección de registro -->
          <div class="caja__trasera-register">
            <h3>¿Aún no tienes una cuenta?</h3>
            <!-- Pregunta al usuario -->
            <p>Regístrate para que puedas iniciar sesión</p>
            <!-- Instrucciones -->
            <button id="btn__registrarse">Regístrarse</button>
            <!-- Botón de registro -->
          </div>
        </div>

        <!-- Formulario para login y registro -->
        <div class="contenedor__login-register">
          <!-- Formulario de inicio de sesión -->
          <form action="" class="formulario__login">
            <h2>Iniciar Sesión</h2>
            <!-- Título del formulario -->
            <input type="email" placeholder="Correo Electronico" required />
            <!-- Campo de correo -->
            <input type="password" placeholder="Contraseña" required />
            <!-- Campo de contraseña -->
            <button onclick="irInicio()">Entrar</button>
            <!-- Botón para enviar -->
            <div class="olvido-contrasena">
              <a href="#" id="olvido-password">¿Olvidaste tu contraseña?</a>
            </div>
          </form>

          <!-- Formulario de registro -->
          <form action="" class="formulario__register">
            <h2>Regístrarse</h2>
            <!-- Título del formulario -->
            <input type="text" placeholder="Nombres" required />
            <input type="text" placeholder="Apellidos" required />
            <!-- Campo de nombre -->
            <input type="email" placeholder="Correo Electrónico" required />
            <!-- Campo de correo -->

            <input type="password" placeholder="Contraseña" required />
            <input type="password" placeholder="Telefono" required />
    
            <!-- Campo de contraseña -->

            <!-- Campo de Año de Nacimiento -->
            <label for="birthYear">Año de nacimiento:</label>
            <input type="date" id="birthYear" required />
            <!-- Selector de fecha -->


            <button type="submit">Regístrarse</button>
            <!-- Botón para enviar -->
          </form>
        </div>
      </div>

      <!-- Botón de volver al inicio -->
      <a id="btn__volver-inicio" class="btn__volver" href="../Principal/index.html"
        >Volver al inicio</a
      >
    </main>

    <!-- Scripts JavaScript para lógica de login y registro -->
    <script src="loginscript.js"></script>

  </body>
</html>
